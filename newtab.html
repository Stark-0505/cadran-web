<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17171b">
  <meta name="description" content="Cadran, a customizable start page for your browser">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-32.png">
  <title data-i18n="newTabTitle">New Tab</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/tiles.css">
  <link rel="stylesheet" href="css/ui.css">
  <script src="js/web-compat.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('./pwa-sw.js').catch((error) => console.error('Cadran service worker:', error));
    }
    window.addEventListener('error', (event) => {
      if (event.target && event.target !== window && /\.js(?:$|\?)/.test(event.target.src || '')) {
        showStartupError('A JavaScript file failed to load. Check the deployed GitHub Pages files, then reload.');
      }
    }, true);
    window.addEventListener('unhandledrejection', (event) => {
      console.error('Cadran startup error:', event.reason);
    });
    function showStartupError(message) {
      const panel = document.getElementById('startup-error');
      if (panel) { panel.hidden = false; panel.textContent = message; }
    }
    window.CadranStartupError = showStartupError;
  </script>
  <script type="module" src="js/app.js" onerror="window.CadranStartupError && window.CadranStartupError('Cadran could not load its app module. Check that all project files were uploaded, then reload.')" onload="document.getElementById('startup-error')?.setAttribute('hidden', '')"></script>
</head>
<body>
  <div id="wallpaper" aria-hidden="true"></div>
  <div id="dim" aria-hidden="true"></div>
  <div id="startup-error" hidden role="alert">Cadran could not start. Check the deployed project files and reload.</div>
  <!-- Applique le fond et la mise en page mémorisés avant le premier affichage -->
  <script src="js/boot.js"></script>

  <main id="page">
    <header id="top">
      <div id="clock" hidden>
        <div class="time"></div>
        <div class="subline"><span class="greeting"></span><span class="date"></span></div>
      </div>
      <div id="search" hidden>
        <form class="search-box" role="search" autocomplete="off">
          <button type="button" class="engine-btn" data-i18n-title="chooseEngine" data-i18n-aria-label="chooseEngine"></button>
          <input type="text" name="q" data-i18n-aria-label="search" spellcheck="false" autocomplete="off">
          <kbd class="hint" data-i18n-title="shortcut">/</kbd>
        </form>
        <div class="search-results glass-panel" role="listbox" hidden></div>
      </div>
    </header>

    <nav id="groups" data-i18n-aria-label="tabFolders" hidden></nav>
    <div id="notice"></div>
    <section id="content" aria-live="polite"></section>
    <section id="extras"></section>
  </main>

  <div id="corner">
    <button id="btn-import-bookmarks" class="round-btn import-bookmarks-btn" type="button" aria-label="Import bookmarks HTML" title="Import bookmarks HTML">⇧</button>
    <button id="btn-settings" class="round-btn" type="button" data-i18n-title="panelTitle" data-i18n-aria-label="panelTitle"></button>
    <input id="bookmarks-html-input" type="file" accept=".html,.htm,text/html" hidden>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const button = document.getElementById('btn-import-bookmarks');
      const input = document.getElementById('bookmarks-html-input');
      button?.addEventListener('click', () => input?.click());
      input?.addEventListener('change', async () => {
        const file = input.files?.[0]; input.value = '';
        if (!file) return;
        try {
          const html = await file.text();
          const count = window.CadranImportBookmarks?.(html);
          if (!count) { alert('No bookmarks were found. Choose a bookmarks HTML export.'); return; }
          alert(`Imported ${count} bookmarks. Cadran will reload now.`);
          location.reload();
        } catch (error) { console.error(error); alert('Could not import this bookmarks file.'); }
      });
    });
  </script>
  <aside id="panel" class="glass-panel" data-i18n-aria-label="panelTitle"></aside>
  <div id="layer"></div>
</body>
</html>
